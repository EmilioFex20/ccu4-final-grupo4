name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# En PRs se cancelan corridas viejas; en main no, para no cortar un push de imágenes a medias.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 1) Validación del código de la API (FastAPI)
  validate-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Misma versión que api/Dockerfile (python:3.13-slim)
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt ruff pytest

      - name: Lint (solo errores graves)
        run: ruff check . --select E9,F63,F7,F82

      - name: Tests
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "Todavía no hay carpeta tests/, se omite este paso"
          fi

  # 2) Prueba de humo: levanta todo el stack y revisa /health
  smoke-test:
    runs-on: ubuntu-latest
    needs: validate-api
    steps:
      - uses: actions/checkout@v4

      - name: Preparar .env
        # .env.example solo tiene valores de prueba (sin credenciales reales)
        run: cp .env.example .env

      - name: Levantar el stack
        run: docker compose up -d --build

      - name: Esperar a que la API responda /health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then
              echo ""
              echo "API lista"
              exit 0
            fi
            sleep 2
          done
          echo "La API no respondió a tiempo"
          exit 1

      - name: Revisar que el frontend responda
        # El contenedor web (Nginx) escucha en el puerto 8080 y docker-compose lo
        # publica en el 3000 del host (3000:8080). Ojo para el reverse proxy:
        # los nodos nuevos van a exponer el 8080, no el 3000.
        run: curl -fsS -o /dev/null http://localhost:3000

      - name: Logs si algo falló
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Apagar el stack
        if: always()
        run: docker compose down -v

  # 3) Construir imágenes (siempre) y subirlas a GHCR (solo en push a main)
  build-and-push:
    runs-on: ubuntu-latest
    needs: [validate-api, smoke-test]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen en minúsculas
        # GHCR exige minúsculas y el owner (EmilioFex20) tiene mayúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags y labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
