global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: ccu4-final-grupo4
    environment: local

rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: app-exporter
    static_configs:
      - targets: ["app-exporter:9101"]

  - job_name: docker-exporter
    static_configs:
      - targets: ["docker-exporter:9102"]

  - job_name: controller
    file_sd_configs:
      - files:
          - targets.d/controller.json
        refresh_interval: 30s

  - job_name: reverse-proxy
    file_sd_configs:
      - files:
          - targets.d/reverse-proxy.json
        refresh_interval: 30s
